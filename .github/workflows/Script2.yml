name: Overpowered Windows Workspace (RDP)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Latest Tailscale
        shell: powershell
        run: |
          $tsMsiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale-setup.msi"
          Invoke-WebRequest -Uri $tsMsiUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-win-runner-${{ github.run_id }}
          $tsIP = $null
          for ($i=0; $i -lt 12; $i++) {
              $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
              if ($tsIP) { break }
              Start-Sleep -Seconds 5
          }
          if (-not $tsIP) { throw "Tailscale IP allocation timed out." }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Create Dynamic Credentials
        shell: powershell
        run: |
          $username = "dev_user"
          $password = "P@ssword123!" 
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          echo $username > "$env:TEMP\rdp_user.txt"
          echo $password > "$env:TEMP\rdp_pass.txt"

      - name: Harden and Allow RDP (NLA Disabled for Compatibility)
        shell: powershell
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # DISABLE NLA for better mobile compatibility (0 = disabled)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          # Force Firewall Allow
          New-NetSecurityRule -DisplayName "Allow-All-RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -Profile Any
          
          Restart-Service -Name "TermService" -Force

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host "IP: $env:TAILSCALE_IP | User: dev_user | Pass: P@ssword123!"
          while ($true) { Start-Sleep -Seconds 300 }
